[package]
name = "mcpd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A local MCP configuration control plane"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
directories = "6"
fs2 = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
notify = "8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.9"
toml_edit = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
zeroize = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"

[profile.release]
lto = "thin"
strip = "symbols"
