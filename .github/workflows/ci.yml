name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Check
        run: cargo check --locked --all-targets --all-features
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets --all-features
      - name: Release build
        run: cargo build --locked --release
      - name: Cargo install smoke test
        run: cargo install --locked --path . --root "${RUNNER_TEMP}/syncplane-install"
      - name: CLI smoke tests
        run: |
          "${RUNNER_TEMP}/syncplane-install/bin/syncplane" --version
          "${RUNNER_TEMP}/syncplane-install/bin/syncplane" completions bash > "${RUNNER_TEMP}/syncplane.bash"
          test -s "${RUNNER_TEMP}/syncplane.bash"
      - name: Installer fixture
        run: sh tests/install.sh
      - name: RustSec advisory audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run build
